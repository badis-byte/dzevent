name: dzevent
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  flutter_bloc: ^9.1.1
