  uuid: ^4.5.2
  flutter_gen: ^5.12.0
  image_picker: ^1.1.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/images/event_feed/
    - assets/images/event_details/
    - assets/images/users/
  uses-material-design: true
  generate: true
